name: ${STUDENT:=rodionov}-l2

mgmt:
  network: clab-${STUDENT:=rodionov}-l2
  ipv4-subnet: 10.102.${N:=53}.0/24

topology:
  kinds:
    sonic-vs:
      image: sonic-course:202511
    linux:
      image: lab-tools:1.0

  nodes:
    r1:
      kind: sonic-vs

    r2:
      kind: sonic-vs

    pc1:
      kind: linux
      exec:
        - ip addr add 10.${N:=53}.1.10/24 dev eth1
        - ip route replace default via 10.${N:=53}.1.1 dev eth1

    pc2:
      kind: linux
      exec:
        - ip addr add 10.${N:=53}.2.10/24 dev eth1
        - ip route replace default via 10.${N:=53}.2.1 dev eth1

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth2"]
    - endpoints: ["pc2:eth1", "r2:eth1"]
